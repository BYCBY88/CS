<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D1导出TXT工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:14px;max-width:720px;margin:0 auto}
button{padding:9px 18px;margin:6px;font-size:14px}
#status{margin:12px 0;color:#333;font-size:13px}
</style>
</head>
<body>
<h3>D1 collections + measured_scores 导出TXT</h3>
<div id="status"></div>
<button id="fetchBtn">拉取D1数据</button>
<button id="downloadBtn" disabled>下载txt文件</button>

<script>
const API_URL = "https://d1-export-worker.bycby88.workers.dev/api/export-txt";
let rawText = "";
const statusEl = document.getElementById("status");
const fetchBtn = document.getElementById("fetchBtn");
const downloadBtn = document.getElementById("downloadBtn");

fetchBtn.onclick = async ()=>{
  statusEl.innerText = "正在请求D1数据...";
  rawText = "";
  downloadBtn.disabled = true;
  try{
    const res = await fetch(API_URL);
    if(!res.ok){
      const err = await res.json();
      throw new Error(err.error || "请求失败");
    }
    rawText = await res.text();
    statusEl.innerText = `获取成功，字符数：${rawText.length}`;
    downloadBtn.disabled = false;
  }catch(e){
    statusEl.innerText = "错误："+e.message;
  }
}

downloadBtn.onclick = ()=>{
  const blob = new Blob([rawText],{type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `d1_export_${new Date().toISOString().slice(0,19)}.txt`;
  a.click();
}
</script>
</body>
</html>
